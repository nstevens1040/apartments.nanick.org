            function taClip() {
                var favsJson = localStorage.getItem("favjson");
                if (favsJson === null) {
                    return false;
                }
                var textarea = document.createElement("textarea");
                textarea.value = favsJson;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";
                textarea.style.height = "0px";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand("copy");
                    console.log("Copied to clipboard:", favsJson);
                    var btn = document.getElementById("clip_btn");
                    btn.disabled = true;
                    btn.innerHTML = "Copied!"
                    setTimeout( () => {
                        btn.disabled = false;
                        btn.innerHTML = "Copy Favorites as JSON";
                        console.log("used taClip()");
                    }
                    , 3000);
                } catch (err) {
                    console.error("Failed to copy:", err);
                } finally {
                    document.body.removeChild(textarea);
                }
            }
            function clip() {
                var favjson = localStorage.getItem("favjson");
                if (favjson === null) {
                    console.log("favjson has no data!");
                    return;
                }
                try {
                    navigator.clipboard.writeText(favjson).then( (resolve) => {
                        var btn = document.getElementById("clip_btn");
                        btn.disabled = true;
                        btn.innerHTML = "Copied!";
                        setTimeout( () => {

                            console.log("used clip()");
                        }
                        , 3000);
                    }

                    console.error("navigator.clipboard.writeText failed", err);
                    taClip();

            function sortJsonObject(prop) {
                return function(a, b) {
                    var lprop = prop;
                    // console.log(JSON.stringify('{"sortBy":"' + lprop + '"}'));
                    switch (lprop) {
                    case "Address":
                        if (a[prop] > b[prop]) {
                            return (1 * descending);
                        }
                        if (a[prop] < b[prop]) {
                            return (-1 * descending);
                        }
                        return 0;
                        break;
                    case "Price_Low":
                        var arating = parseFloat(a[prop]);
                        var brating = parseFloat(b[prop]);
                        if (arating >= brating) {
                            return (1 * descending);
                        } else if (arating < brating) {
                            return (-1 * descending);
                        }
                        break;
                    case "Baths_min":
                        var arating = parseFloat(a[prop]);
                        var brating = parseFloat(b[prop]);
                        if (arating >= brating) {
                            return (1 * descending);
                        } else if (arating < brating) {
                            return (-1 * descending);
                        }
                        break;
                    case "Beds_min":
                        var arating = parseFloat(a[prop]);
                        var brating = parseFloat(b[prop]);
                        if (arating >= brating) {
                            return (1 * descending);
                        } else if (arating < brating) {
                            return (-1 * descending);
                        }
                        break;
                    case "Link":
                        if (a[prop] > b[prop]) {
                            return (1 * descending);
                        }
                        if (a[prop] < b[prop]) {
                            return (-1 * descending);
                        }
                        return 0;
                        break;
                    case "PropertyManager":
                        if (a[prop] > b[prop]) {
                            return (1 * descending);
                        }
                        if (a[prop] < b[prop]) {
                            return (-1 * descending);
                        }
                        return 0;
                        break;
                    case "PhoneNumber":
                        if (a[prop] > b[prop]) {
                            return (1 * descending);
                        }
                        if (a[prop] < b[prop]) {
                            return (-1 * descending);
                        }
                        return 0;
                        break;
                    case "OriginPlatform":
                        if (a[prop] > b[prop]) {
                            return (1 * descending);
                        }
                        if (a[prop] < b[prop]) {
                            return (-1 * descending);
                        }
                        return 0;
                        break;
                    default:
                        console.log(JSON.stringify('{"sortBy":"default"}'));
                        if (a[prop] >= b[prop]) {
                            return (1 * descending);
                        } else if (a[prop] < b[prop]) {
                            return (-1 * descending);
                        }
                        break;
                    }
                    return 0;
                }
            }

                var o = JSON.parse(x.parentElement.parentElement.parentElement.dataset.json);
                if (favorites.indexOf(o.Id) === -1) {
                    favorites.push(o.Id);
                }
                var uniqfav = [...new Set(favorites)];
                localStorage.setItem('favorites', JSON.stringify(uniqfav));
                var json_string = JSON.stringify(o);
                if (localStorage.getItem('favjson')) {
                    var current_favjson = localStorage.getItem('favjson');
                    var fav_object = JSON.parse(current_favjson);
                    var allids = [];
                    fav_object.forEach(i => {
                        allids.push(i.Id);
                    }
                    );
                    var uniqids = [...new Set(allids)];
                    var new_favobject = [];
                    for (var i = 0; i < uniqids.length; i++) {
                        var id_ = uniqids[i];
                        var item = all_results.filter(a => {
                            return (a.Id === id_);
                        }
                        )[0];
                        new_favobject.push(item);
                    }
                    if (uniqids.indexOf(o.Id) === -1) {
                        new_favobject.push(o);
                    }
                    var new_favjson = JSON.stringify(new_favobject);
                    localStorage.setItem("favjson", new_favjson);
                } else {
                    var fav_object = [];
                    fav_object.push(o);
                    var new_favjson = JSON.stringify(fav_object);
                    localStorage.setItem("favjson", new_favjson);
                }
            }
            function removeFav(x) {
                favorites = JSON.parse(localStorage.getItem("favorites"));
                var o = JSON.parse(x.parentElement.parentElement.parentElement.dataset.json);
                var index = favorites.indexOf(o.Id);
                if (index > -1) {
                    favorites.splice(index, 1)
                }
                var uniqfav = [...new Set(favorites)];
                localStorage.setItem('favorites', JSON.stringify(uniqfav));
                var current_favobject = JSON.parse(localStorage.getItem('favjson'));
                var new_list = [];
                current_favobject.filter(a => {
                    return (a.Id != o.Id)
                }
                ).forEach(i => {
                    new_list.push(i);
                }
                );
                var allids = [];
                new_list.forEach(i => {
                    allids.push(i.Id);
                }
                );
                var uniqids = [...new Set(allids)];
                var new_favobject = [];
                for (var i = 0; i < uniqids.length; i++) {
                    var id_ = uniqids[i];
                    var item = all_results.filter(a => {
                        return (a.Id === id_);
                    }
                    )[0];
                    new_favobject.push(item);
                }
                localStorage.setItem("favjson", JSON.stringify(new_favobject));
            }
            function favOff(x) {
                x.checked = false;
                if (x.getAttribute("onclick")) {
                    x.removeAttribute("onclick");
                }
                x.setAttribute("onclick", 'starClick(this);');
                if (x.labels[0].classList.contains("fav")) {
                    x.labels[0].classList.remove("fav");
                }
                if (x.parentElement.classList.contains("fav")) {
                    x.parentElement.classList.remove("fav");
                }
                x.labels[0].classList.add("notfav");
                x.parentElement.classList.add("notfav");
                x.labels[0].innerHTML = '&star;';
                x.labels[0].title = "Add Favorite";
                if (x.getAttribute("onmouseover")) {
                    x.removeAttribute("onmouseover");
                }
                x.labels[0].setAttribute("onmouseover", "onHover(this);");
                if (x.getAttribute("onmouseout")) {
                    x.removeAttribute("onmouseout");
                }
                x.labels[0].setAttribute("onmouseout", "mouseOut(this);");
            }
            function favOn(x) {
                x.checked = true;
                if (x.getAttribute("onclick")) {
                    x.removeAttribute("onclick");
                }
                x.setAttribute("onclick", 'starUnclick(this);');
                if (x.labels[0].classList.contains("notfav")) {
                    x.labels[0].classList.remove("notfav");
                }
                if (x.parentElement.classList.contains("notfav")) {
                    x.parentElement.classList.remove("notfav");
                }
                x.labels[0].classList.add("fav");
                x.parentElement.classList.add("fav");
                x.labels[0].innerHTML = '&starf;';
                x.labels[0].title = "Remove Favorite";
                if (x.getAttribute("onmouseover")) {
                    x.removeAttribute("onmouseover");
                }
                x.labels[0].setAttribute("onmouseover", "reverseHover(this);");
                if (x.getAttribute("onmouseout")) {
                    x.removeAttribute("onmouseout");
                }
                x.labels[0].setAttribute("onmouseout", "reverseMouseOut(this);");
            }
        </script>
    </head>
